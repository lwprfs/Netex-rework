<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" id="hljs-theme" href="">
<style>
:root {
    --bg: #1f1f23; --surface: #2c2c30; --surface-low: #25252a;
    --fg: #e4e1e9; --fg-dim: #aaa9b3; --outline: #46464f;
    --primary: #c0c1ff; --pc: #3a38b8; --opc: #e1e0ff;
    --err: #ffb4ab; --ok: #5fd08a; --warn: #ffca4d; --rec: #ff6b66;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { font: 13px/1.4 system-ui, -apple-system, Roboto, sans-serif; color: var(--fg); background: var(--bg); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; }

.tab { display: none; position: absolute; inset: 0; flex-direction: column; }
.tab.active { display: flex; }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }

/* ---- toolbars & chips ---- */
.bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; flex-shrink: 0; background: var(--bg); border-bottom: 1px solid var(--outline); }
.bar.wrap { flex-wrap: wrap; }
.chip { padding: 5px 11px; border-radius: 999px; background: var(--surface); color: var(--fg-dim); font-weight: 600; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
.chip.on { background: var(--pc); color: var(--opc); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.chips::-webkit-scrollbar { display: none; }
.spacer { flex: 1; }
.count { font-variant-numeric: tabular-nums; }
.chip .n { opacity: .75; margin-left: 4px; font-weight: 500; }
.chip.warn.on { background: color-mix(in srgb, var(--warn) 28%, transparent); color: var(--warn); }
.chip.error.on { background: color-mix(in srgb, var(--err) 28%, transparent); color: var(--err); }
.empty { padding: 36px 20px; text-align: center; color: var(--fg-dim); }
.empty b { display: block; color: var(--fg); font-size: 14px; margin-bottom: 4px; }

/* ---- console ---- */
#consoleEntries { padding: 4px 10px; font: 12px/1.45 var(--mono); }
.entry { display: flex; flex-wrap: wrap; gap: 2px 8px; padding: 6px 4px; border-bottom: 1px solid color-mix(in srgb, var(--outline) 55%, transparent); }
.entry .glyph { flex-shrink: 0; width: 14px; text-align: center; opacity: .7; }
.entry .msg { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
.entry .src { flex: 0 0 100%; padding-left: 22px; text-align: right; opacity: .5; font-size: 11px; word-break: break-all; }
.entry.warn { background: color-mix(in srgb, var(--warn) 10%, transparent); }
.entry.warn .msg, .entry.warn .glyph { color: var(--warn); opacity: 1; }
.entry.error, .entry.result_error { background: color-mix(in srgb, var(--err) 10%, transparent); }
.entry.error .msg, .entry.error .glyph, .entry.result_error .msg, .entry.result_error .glyph { color: var(--err); opacity: 1; }
.entry.input .glyph, .entry.input .msg, .entry.result .glyph { color: var(--primary); }
#consoleEntries[data-f="log"] .entry.warn, #consoleEntries[data-f="log"] .entry.error, #consoleEntries[data-f="log"] .entry.result_error,
#consoleEntries[data-f="warn"] .entry.log, #consoleEntries[data-f="warn"] .entry.info, #consoleEntries[data-f="warn"] .entry.debug, #consoleEntries[data-f="warn"] .entry.error, #consoleEntries[data-f="warn"] .entry.result_error,
#consoleEntries[data-f="error"] .entry.log, #consoleEntries[data-f="error"] .entry.info, #consoleEntries[data-f="error"] .entry.debug, #consoleEntries[data-f="error"] .entry.warn { display: none; }

.prompt { display: flex; align-items: center; gap: 8px; margin: 8px 10px 10px; padding: 8px 14px; flex-shrink: 0; background: var(--surface); border-radius: 999px; }
.prompt span { color: var(--primary); font-family: var(--mono); line-height: 1; }
.prompt input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: inherit; font: 13px var(--mono); padding: 3px 0; }

/* ---- source ---- */
#source-tab pre { margin: 0; padding: 12px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
code.hljs { background: transparent !important; padding: 0 !important; }

/* ---- network ---- */
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 999px; padding: 0 12px; }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: inherit; font: inherit; padding: 7px 0; }
.search svg { width: 14px; height: 14px; fill: var(--fg-dim); flex-shrink: 0; }
.har-btn { padding: 6px 11px; border-radius: 999px; font-weight: 700; font-size: 12px; background: var(--surface); flex-shrink: 0; position: relative; }
.har-btn::after { content: ''; position: absolute; inset: -6px -4px; }
.har-btn.recording { background: color-mix(in srgb, var(--rec) 28%, transparent); color: var(--rec); }
.har-btn.paused { background: color-mix(in srgb, var(--warn) 28%, transparent); color: var(--warn); }
.stats { display: flex; gap: 10px; padding: 6px 12px; font-size: 11.5px; color: var(--fg-dim); flex-shrink: 0; border-bottom: 1px solid var(--outline); }

.req { border-bottom: 1px solid color-mix(in srgb, var(--outline) 55%, transparent); }
.req.hide { display: none; }
.req > summary { padding: 9px 12px; cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; background: var(--bg); }
.req > summary::-webkit-details-marker { display: none; }
.req[open] > summary { position: sticky; top: 0; z-index: 1; background: var(--surface-low); }
.method { font-weight: 700; font-size: 11px; padding: 2px 7px; border-radius: 6px; min-width: 44px; text-align: center; flex-shrink: 0; background: var(--surface); }
.method.GET { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
.method.POST { background: color-mix(in srgb, var(--primary) 22%, transparent); color: var(--primary); }
.method.PUT, .method.PATCH { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.method.DELETE { background: color-mix(in srgb, var(--err) 22%, transparent); color: var(--err); }
.url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.size { color: var(--fg-dim); flex-shrink: 0; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.status { font-weight: 700; flex-shrink: 0; min-width: 34px; text-align: right; }
.status.s2xx { color: var(--ok); } .status.s3xx { color: var(--warn); }
.status.s4xx, .status.s5xx { color: var(--err); } .status.s0 { opacity: .5; }

.meta { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px 0; }
.meta .tag { padding: 3px 9px; border-radius: 999px; background: var(--surface); color: var(--fg-dim); font-size: 11.5px; }
.fullurl { padding: 8px 12px 0; font: 11.5px/1.4 var(--mono); color: var(--fg-dim); word-break: break-all; }
.actions { display: flex; gap: 6px; padding: 10px 12px; }
.actions button { padding: 6px 12px; border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 12px; }
.actions button:active { background: var(--pc); }
.body pre { margin: 0; padding: 4px 12px 12px; font: 11.5px/1.45 var(--mono); white-space: pre-wrap; word-wrap: break-word; }
.body img { display: block; margin: 0 auto; max-width: 100%; height: auto; padding: 12px; background: var(--surface); }
.body model-viewer { display: block; width: 100%; height: 300px; background: var(--surface); }

/* ---- console extras ---- */
.entry.hide { display: none; }
.entry .ts { display: none; flex-shrink: 0; opacity: .5; font-size: 11px; }
#consoleEntries.ts-on .entry .ts { display: inline; }
.entry.sel { background: color-mix(in srgb, var(--pc) 22%, transparent); }
.entry .eact { display: none; flex: 0 0 100%; padding-left: 22px; gap: 6px; }
.entry.sel .eact { display: flex; }
.eact button { padding: 4px 11px; border-radius: 999px; background: var(--surface); font: 600 11.5px system-ui, sans-serif; }
.sep { padding: 6px 4px; text-align: center; font-size: 11px; color: var(--fg-dim); border-bottom: 1px dashed var(--outline); word-break: break-all; }
.prompt { align-items: flex-end; }
.prompt.multi { border-radius: 18px; }
.prompt textarea { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: inherit; font: 13px var(--mono); padding: 3px 0; resize: none; max-height: 140px; }
.pbtn { padding: 4px 9px; border-radius: 999px; background: var(--bg); font-weight: 700; flex-shrink: 0; }
.pbtn.run { background: var(--pc); color: var(--opc); }
.lbl { color: var(--fg-dim); font-size: 11.5px; min-width: 48px; }
input[type=search] { -webkit-appearance: none; appearance: none; }

/* ---- JSON tree ---- */
.jt, .jv { font: 12px/1.5 var(--mono); }
.jd > summary, .jn { padding: 1px 0 1px 14px; word-break: break-all; }
.jd > summary { cursor: pointer; list-style: none; margin-left: -14px; padding-left: 14px; }
.jd > summary::-webkit-details-marker { display: none; }
.jd > summary::before { content: '▸'; display: inline-block; width: 14px; margin-left: -14px; color: var(--fg-dim); }
.jd[open] > summary::before { content: '▾'; }
.jd .jd, .jd .jn { margin-left: 14px; }
.jkey { color: var(--primary); }
.jstr { color: var(--ok); } .jnum { color: var(--warn); } .jbool { color: var(--rec); } .jnull, .jdim, .jprev { color: var(--fg-dim); }
.jbar { display: flex; gap: 6px; padding: 4px 0 8px; }
.jbar input { flex: 1; min-width: 0; background: var(--surface); border: 0; outline: 0; color: inherit; font: 12px system-ui, sans-serif; padding: 6px 12px; border-radius: 999px; }
.jbar button { padding: 5px 11px; border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 12px; flex-shrink: 0; }
.jhint { color: var(--fg-dim); font: 11px system-ui, sans-serif; padding: 6px 0 0; }
.jv { padding: 4px 12px 12px; }
.entry .msg .jd > summary { margin-left: 0; }
.entry .msg .jd { margin-left: 0; }

/* ---- request details ---- */
.actions { flex-wrap: wrap; }
.sec { border-top: 1px solid color-mix(in srgb, var(--outline) 55%, transparent); }
.sec > summary { padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: 12px; color: var(--fg-dim); list-style: none; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::after { content: ' ▾'; opacity: .6; }
.sec[open] > summary::after { content: ' ▴'; }
.kv { padding: 0 12px 10px; font: 11.5px/1.45 var(--mono); }
.kvrow { display: flex; gap: 8px; padding: 2px 0; }
.kvk { flex: 0 0 38%; color: var(--primary); word-break: break-all; }
.kvv { flex: 1; min-width: 0; word-break: break-all; }
.pad { padding: 4px 12px 10px; }
.tbar { display: flex; height: 10px; margin: 4px 12px 8px; border-radius: 5px; overflow: hidden; background: var(--surface); }
.tseg.t0 { background: var(--fg-dim); } .tseg.t1 { background: #4db6ac; } .tseg.t2 { background: #ffb74d; } .tseg.t3 { background: #ba68c8; }
.tseg.t4 { background: #64b5f6; } .tseg.t5 { background: var(--ok); } .tseg.t6 { background: var(--primary); }
.req.old { opacity: .55; }
.navsep { padding: 5px 12px; text-align: center; font-size: 11px; color: var(--fg-dim); background: var(--surface-low); word-break: break-all; }
iframe.hp { width: 100%; height: 320px; border: 0; background: #fff; display: block; }
.prevbtn { margin: 0 12px 8px; padding: 5px 12px; border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 12px; }

/* ---- overlays (waterfall, replay) ---- */
.ov { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--bg); }
.ovhead { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--outline); flex-shrink: 0; }
.ovbody { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 10px 12px 16px; }
.form label { display: block; margin: 10px 0 4px; color: var(--fg-dim); font-size: 11.5px; font-weight: 600; }
.form input[type=text], .form select, .form textarea { width: 100%; background: var(--surface); border: 0; outline: 0; color: inherit; border-radius: 10px; padding: 8px 10px; font: 12px var(--mono); }
.form textarea { resize: vertical; min-height: 70px; }
.form .chk { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; font-size: 12px; color: var(--fg); font-weight: 500; }
.form .go { margin-top: 12px; padding: 9px 18px; border-radius: 999px; background: var(--pc); color: var(--opc); font-weight: 700; }
.note { color: var(--fg-dim); font-size: 11.5px; margin-top: 8px; }
.err { color: var(--err); }
.wf-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 11.5px; }
.wf-label { flex: 0 0 34%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wf-track { position: relative; flex: 1; height: 12px; background: var(--surface); border-radius: 6px; }
.wf-bar { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: var(--primary); min-width: 3px; }
.wf-bar.e { background: var(--err); } .wf-bar.w { background: var(--warn); }
.wf-ms { flex: 0 0 56px; text-align: right; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div id="console-tab" class="tab active">
  <div class="bar" id="consoleBar"><div class="chips">
    <button class="chip on" data-f="all" id="fAll">All</button>
    <button class="chip" data-f="log" id="fLog">Logs<span class="n" id="consoleLogTotal">0</span></button>
    <button class="chip" data-f="info" id="fInfo">Info</button>
    <button class="chip" data-f="debug" id="fDebug">Debug</button>
    <button class="chip warn" data-f="warn" id="fWarn">Warnings<span class="n" id="consoleWarnTotal">0</span></button>
    <button class="chip error" data-f="error" id="fError">Errors<span class="n" id="consoleErrorTotal">0</span></button>
  </div></div>
  <div class="bar wrap" style="padding-top:6px;padding-bottom:6px">
    <label class="search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="consoleSearch" type="search" placeholder="Filter messages" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <button class="chip" id="cTime">Time</button><button class="chip" id="cKeep">Keep</button><button class="chip" id="cCopy">Copy</button><button class="chip" id="cTxt">TXT</button><button class="chip" id="cJson">JSON</button><button class="chip" id="cClear">Clear</button>
  </div>
  <div class="scroll" id="consoleEntries" data-f="all"></div>
  <form class="prompt" id="consolePrompt"><span>❯</span><textarea id="consoleInput" rows="1" placeholder="Run JavaScript" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea><button type="button" class="pbtn" id="cPrev" aria-label="Previous command">↑</button><button type="button" class="pbtn" id="cNext" aria-label="Next command">↓</button><button type="button" class="pbtn" id="cMulti" aria-label="Multi-line">↵</button><button type="button" class="pbtn" id="cHistClear" aria-label="Clear command history">✕</button><button type="submit" class="pbtn run" id="cRun">Run</button></form>
</div>

<div id="source-tab" class="tab">
  <div class="bar"><span class="count" id="sourceInfo" style="color:var(--fg-dim)">Page source</span><span class="spacer"></span><button class="chip" id="sourceCopy">Copy HTML</button></div>
  <div class="scroll"><pre><code class="language-html"></code></pre></div>
</div>

<div id="network-tab" class="tab">
  <div class="bar">
    <label class="search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="netSearch" type="search" placeholder="Filter: url, method, status, type" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <button type="button" class="har-btn" id="harBtn">HAR</button>
  </div>
  <div class="bar" style="padding-top:6px;padding-bottom:6px"><div class="chips" id="netChips">
    <button class="chip on" data-t="all">All</button><button class="chip" data-t="doc">Doc</button><button class="chip" data-t="js">JS</button><button class="chip" data-t="css">CSS</button><button class="chip" data-t="img">Img</button><button class="chip" data-t="media">Media</button><button class="chip" data-t="font">Font</button><button class="chip" data-t="fetch">Fetch</button><button class="chip" data-t="xhr">XHR</button><button class="chip" data-t="data">Data</button><button class="chip" data-t="other">Other</button><button class="chip" data-t="err">Errors</button><button class="chip" data-t="slow">Slow</button><button class="chip" data-t="more">Filters ▾</button>
  </div></div>
  <div id="netMore" style="display:none">
    <div class="bar" style="padding-top:6px;padding-bottom:6px"><span class="lbl">Method</span><div class="chips" id="netMethods"><button class="chip on" data-m="all">All</button><button class="chip" data-m="GET">GET</button><button class="chip" data-m="POST">POST</button><button class="chip" data-m="PUT">PUT</button><button class="chip" data-m="PATCH">PATCH</button><button class="chip" data-m="DELETE">DELETE</button></div></div>
    <div class="bar" style="padding-top:6px;padding-bottom:6px"><span class="lbl">Status</span><div class="chips" id="netStatuses"><button class="chip on" data-s="all">All</button><button class="chip" data-s="2">2xx</button><button class="chip" data-s="3">3xx</button><button class="chip" data-s="4">4xx</button><button class="chip" data-s="5">5xx</button><button class="chip" data-s="failed">Failed</button></div></div>
  </div>
  <div class="bar" style="padding-top:6px;padding-bottom:6px"><button class="chip" id="nKeep">Keep log</button><button class="chip" id="nWater">Waterfall</button><button class="chip" id="nCopyUrls">Copy URLs</button><button class="chip" id="nExport">Export</button></div>
  <div class="stats"><span id="netTotalsCount"></span><span class="spacer"></span><span id="netTotalsSize"></span></div>
  <div class="scroll" id="netList"><div class="empty"><b>No requests yet</b>Load or reload a page to see its network traffic.</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify-css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify-html.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<!--__PANEL_JS__-->
</body>
</html>
