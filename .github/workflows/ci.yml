permissions:
  contents: read

name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The ubuntu runner already ships the Android SDK (ANDROID_HOME, licenses accepted),
      # so no separate SDK setup step is needed.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---- Debug APK (always) ----
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --build-cache --parallel --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netex-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---- Signed release APK (only when the signing secrets exist) ----
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 is not set - skipping the signed release build"
          fi

      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE" | base64 -di > "$RUNNER_TEMP/release.keystore"

      - name: Build and sign release APK
        if: steps.signing.outputs.enabled == 'true'
        run: ./gradlew :app:assembleRelease --build-cache --parallel --stacktrace
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Remove keystore
        if: always() && steps.signing.outputs.enabled == 'true'
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: netex-release-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
